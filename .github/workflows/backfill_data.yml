name: Manual Backfill & Gap-Fill Stock History

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days back to fetch missing historical stock data (default: 60)'
        required: false
        default: '60'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backfill-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (For TimesFM AI Forecast Model)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm install

      - name: Backfill and complete missing stock history
        run: node scripts/backfill_history.js --days ${{ inputs.days_back || '60' }}

      - name: Commit and push backfilled data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TARGET_BRANCH="${{ github.ref_name || 'main' }}"
          MAX_RETRIES=3

          for i in $(seq 1 $MAX_RETRIES); do
            git fetch origin "$TARGET_BRANCH"
            git reset "origin/$TARGET_BRANCH"
            git add -A public/data/ data_hub/ README.md
            if git diff --staged --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "chore: manual backfill of missing stock history & forecast [skip ci]"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed changes."
              break
            else
              echo "Push failed (concurrent push detected), retrying ($i/$MAX_RETRIES)..."
              sleep 3
            fi
          done

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: backfill-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
