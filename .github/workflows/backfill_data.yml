name: Manual Backfill & Gap-Fill Stock History

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days back to fetch missing historical stock data (default: 60)'
        required: false
        default: '60'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backfill-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (For TimesFM AI Forecast Model)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm install

      - name: Backfill and complete missing stock history
        run: node scripts/backfill_history.js --days ${{ inputs.days_back || '60' }}

      - name: Commit and push backfilled data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/stock_history.json public/data/meta.json public/data/dividends.json public/data/forecast.json README.md data_hub/
          if ! git diff --staged --quiet; then
            git commit -m "chore: manual backfill of missing stock history & forecast [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: backfill-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
