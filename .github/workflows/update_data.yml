name: Update Stock Data & Deploy

on:
  schedule:
    # US Market opens at 9:30 AM ET. 
    # In EDT (Summer) this is 13:30 UTC. In EST (Winter) this is 14:30 UTC.
    # We trigger at 13:30 UTC to cover the summer opening.
    - cron: '30 13 * * 1-5'
    
    # Runs every 30 minutes (minutes 0 and 30) from 14:00 to 20:30 UTC.
    # This covers the core trading hours for both Winter and Summer.
    - cron: '0,30 14-20 * * 1-5'
    
    # US Market closes at 4:00 PM ET.
    # In EDT (Summer) this is 20:00 UTC. In EST (Winter) this is 21:00 UTC.
    # We trigger at 21:00 UTC to cover the winter closing.
    - cron: '0 21 * * 1-5'
    
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (For TimesFM AI Forecast Model)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm install

      - name: Fetch stock data and update charts
        run: node scripts/update_data.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/stock_history.json public/data/meta.json public/data/dividends.json public/data/forecast.json README.md data_hub/
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update stock history, charts and README [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
