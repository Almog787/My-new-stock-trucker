name: Update Stock Data & Deploy

on:
  schedule:
    # Runs every 15 minutes during US market hours (13:00 to 21:59 UTC / 16:00 to 01:00 Israel time) Mon-Fri.
    # Uses off-peak minutes (07, 22, 37, 52) split into explicit cron entries for 100% parser compatibility.
    - cron: '7 13-21 * * 1-5'
    - cron: '22 13-21 * * 1-5'
    - cron: '37 13-21 * * 1-5'
    - cron: '52 13-21 * * 1-5'
    
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (For TimesFM AI Forecast Model)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm install

      - name: Fetch stock data and update charts
        run: node scripts/update_data.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TARGET_BRANCH="${{ github.ref_name || 'main' }}"
          MAX_RETRIES=3
          PUSH_SUCCESS=0

          for i in $(seq 1 $MAX_RETRIES); do
            git fetch origin "$TARGET_BRANCH"
            git reset "origin/$TARGET_BRANCH"
            git add -A public/data/ data_hub/ README.md
            if git diff --staged --quiet; then
              echo "No changes to commit."
              PUSH_SUCCESS=1
              break
            fi
            git commit -m "chore: auto-update stock history, charts and README [skip ci]"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed changes."
              PUSH_SUCCESS=1
              break
            else
              echo "Push failed (concurrent push detected), retrying ($i/$MAX_RETRIES)..."
              sleep 3
            fi
          done

          if [ "$PUSH_SUCCESS" -ne 1 ]; then
            echo "Error: Failed to push changes after $MAX_RETRIES attempts."
            exit 1
          fi

      # Quality Gate: Run data integrity and E2E validation on the newly generated data
      - name: Validate TypeScript & Lint
        run: npm run lint

      - name: Validate Updated Data Integrity
        run: npm run test:data

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E Verification Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-data-e2e-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
