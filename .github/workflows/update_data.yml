name: Update Stock Data & Deploy

on:
  schedule:
    # Runs twice an hour (every 30 minutes) during US market hours (13:00 to 21:59 UTC) Mon-Fri.
    # Uses off-peak minutes (07, 37) for faster GitHub Actions scheduling and 100% parser compatibility.
    - cron: '7 13-21 * * 1-5'
    - cron: '37 13-21 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch stock data, forecast and update charts
        run: node scripts/update_data.js

      - name: Validate Data & Calculations Integrity
        run: npm run test:data

      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TARGET_BRANCH="${{ github.ref_name || 'main' }}"
          MAX_RETRIES=3
          PUSH_SUCCESS=0
          HAS_CHANGES="false"

          for i in $(seq 1 $MAX_RETRIES); do
            git fetch origin "$TARGET_BRANCH"
            git reset "origin/$TARGET_BRANCH"
            git add -A public/data/ data_hub/ README.md
            if git diff --staged --quiet; then
              echo "No changes to commit."
              PUSH_SUCCESS=1
              HAS_CHANGES="false"
              break
            fi
            HAS_CHANGES="true"
            git commit -m "chore: auto-update stock history, charts and README [skip ci]"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed changes."
              PUSH_SUCCESS=1
              break
            else
              echo "Push failed (concurrent push detected), retrying ($i/$MAX_RETRIES)..."
              sleep 3
            fi
          done

          echo "changed=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$PUSH_SUCCESS" -ne 1 ]; then
            echo "Error: Failed to push changes after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Build Web Application
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: update-and-build
    if: needs.update-and-build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
