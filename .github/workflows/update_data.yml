name: Update Stock Data & Deploy

on:
  schedule:
    # Runs every 15 minutes during US market hours (EDT & EST) on weekdays (Mon-Fri).
    # Uses off-peak minutes (7, 22, 37, 52) to avoid round-hour runner congestion.
    # 13:00 to 21:59 UTC covers 9:00 AM to 5:00 PM Eastern Time (Summer & Winter).
    - cron: '7,22,37,52 13-21 * * 1-5'
    
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (For TimesFM AI Forecast Model)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm install

      - name: Fetch stock data and update charts
        run: node scripts/update_data.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data/ data_hub/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update stock history, charts and README [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name || 'main' }}
            git push origin HEAD:${{ github.ref_name || 'main' }}
          else
            echo "No changes to commit."
          fi

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
